name: Check website
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22  # the floor package.json promises
      - name: Test
        run: node --test tests/*.test.mjs
      - name: Build
        run: node scripts/build.mjs
